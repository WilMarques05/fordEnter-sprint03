<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="Icon site" href="Favicon-ford.svg" type="image/svg" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Desafio Sprint 3</title>
  </head>
  <body>
    <header id="header-container">
      <img src="img/logo-ford-256.png" alt="logo-ford" />
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Lançamentos</a></li>
          <li><a href="#">Contato</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section>
        <figure class="img-carro">
          <img src="img/imagem_1.jpg" alt="veículo-ford-ranger-black" />
        </figure>
        <p>
          Essa é a nova <strong>Ford Ranger 2026</strong>. Verifique novidades
          <a href="#">aqui</a>.
        </p>
      </section>
    </main>
    <footer>
      <!-- Englobei tudo que se refere as redes sociais em uma div -->
      <span id="texto-redes-sociais">Redes Sociais:</span>
      <div id="redes-sociais">
        <!-- Removi os ids das tags de imagens -->
        <img
          class="redes-sociais-icones"
          src="img/instagram-logo-50.png"
          alt="icone-instagram"
        />
        <img
          class="redes-sociais-icones"
          src="img/facebook-50.png"
          alt="icone-facebook"
        />
        <img
          class="redes-sociais-icones"
          src="img/youtube-squared-50.png"
          alt="icone-youtube"
        />
      </div>
      <span id="copy">&copy; 2026 Ford Motor Company.</span>
      <img id="icone-ford" src="img/ford-96.png" alt="logo-ford" />
    </footer>
  </body>
</html>
