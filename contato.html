<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/lancamento.css">
    <link rel="stylesheet" href="css/contato.css" />
    <title>Contato</title>
  </head>
  <body>
    <header id="header-container">
      <a href="index.html">
        <img src="img/logo-ford-256.png" alt="logo-ford" />
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="lancamento.html">Lançamentos</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </header>

    <hr />

    <main>
      <section>
        <figure>
          <img id="imagem-carro" src="img/storm.png" alt="ford-ranger-storm" />
        </figure>
        <form>
          <input class="input-form" type="text" placeholder="NOME*" id="nome" />
          <input
            class="input-form"
            type="text"
            placeholder="EMAIL*"
            id="email"
          />
          <input class="input-form" type="text" placeholder="CPF*" id="cpf" />
          <input
            class="input-form"
            type="text"
            placeholder="SOBRENOME*"
            id="sobrenome"
          />
          <input
            class="input-form"
            type="text"
            placeholder="TELEFONE*"
            id="telefone"
          />
          <select class="input-form" name="contato" class="fordform" required>
            <option class="input-form" selected>
              COMO DESEJA SER CONTATADO
            </option>
            <option class="input-form">TELEFONE</option>
            <option class="input-form">E-MAIL</option>
          </select>
          <span class="botao">
            <input class="btn" type="button" value="Enviar" />
          </span>
        </form>
      </section>
    </main>

    <footer>
      <span id="texto-redes-sociais">Redes Sociais:</span>
      <div id="redes-sociais">
        <a href="https://www.instagram.com/fordbrasil" target="_blank">
          <img
            class="redes-sociais-icones"
            src="img/instagram-logo-50.png"
            alt="icone-instagram"
          />
        </a>
        <a href="https://www.facebook.com/FordBrasil" target="_blank">
          <img
            class="redes-sociais-icones"
            src="img/facebook-50.png"
            alt="icone-facebook"
          />
        </a>
        <a href="https://www.youtube.com/@fordbrasil" target="_blank">
          <img
            class="redes-sociais-icones"
            src="img/youtube-squared-50.png"
            alt="icone-youtube"
          />
        </a>
      </div>
      <span id="copy">&copy; 2026 Ford Motor Company.</span>
      <img id="icone-ford" src="img/ford-96.png" alt="logo-ford" />
    </footer>
  </body>
</html>
