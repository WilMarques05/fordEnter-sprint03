<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/lancamento.css" />
    <title>Lançamento</title>
  </head>
  <body>
    <header id="header-container">
      <a href="index.html">
        <img src="img/logo-ford-256.png" alt="logo-ford" />
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="lancamento.html">Lançamentos</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </header>
    <hr />
    <main>
      <section id="container-iframe">
        <figure id="video-ranger">
          <iframe
            width="auto"
            height="auto"
            src="https://www.youtube.com/embed/vQsryuNmsL0"
            title="Ford Ranger 2022 | Gerações"
            frameborder="0"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
              web-share;
            "
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </figure>
      </section>

      <section id="container-comparacao">
        <label class="card-comparacao">
          <img
            class="imagem-card"
            src="img/XL Cabine.png"
            alt="ford Ranger/XL cabine simples"
          />
          <input type="checkbox" name="carro1" class="checkbox" />
          <div id="descricao">
            <span class="descricao"
              >XL Cabine Simples 2.2 Diesel 4X4 MT 2022</span
            >
            <span class="preco-sugerido">Preço Sugerido: R$ 183.850</span>
          </div>
        </label>

        <label class="card-comparacao">
          <img
            class="imagem-card"
            src="img/xls 2.2 diesel.png"
            alt="ford Ranger/XL cabine simples"
          />
          <input type="checkbox" name="carro1" class="checkbox" />
          <div id="descricao">
            <span class="descricao">XLS 2.2 Diesel 4X4 AT 2022</span>
            <span class="preco-sugerido">Preço Sugerido: R$ 220.690</span>
          </div>
        </label>

        <label class="card-comparacao">
          <img
            class="imagem-card"
            src="img/storm.png"
            alt="ford Ranger/XL cabine simples"
          />
          <input type="checkbox" name="carro1" class="checkbox" />
          <div id="descricao">
            <span class="descricao">Storm 3.2 Diesel 4X4 AT 2022</span>
            <span class="preco-sugerido">Preço Sugerido: R$ 222.790</span>
          </div>
        </label>
      </section>
    </main>

    <footer>
      <span id="texto-redes-sociais">Redes Sociais:</span>
      <div id="redes-sociais">
        <a href="https://www.instagram.com/fordbrasil" target="_blank">
          <img
            class="redes-sociais-icones"
            src="img/instagram-logo-50.png"
            alt="icone-instagram"
          />
        </a>
        <a href="https://www.facebook.com/FordBrasil" target="_blank">
          <img
            class="redes-sociais-icones"
            src="img/facebook-50.png"
            alt="icone-facebook"
          />
        </a>
        <a href="https://www.youtube.com/@fordbrasil" target="_blank">
          <img
            class="redes-sociais-icones"
            src="img/youtube-squared-50.png"
            alt="icone-youtube"
          />
        </a>
      </div>
      <span id="copy">&copy; 2026 Ford Motor Company.</span>
      <img id="icone-ford" src="img/ford-96.png" alt="logo-ford" />
    </footer>
  </body>
</html>
